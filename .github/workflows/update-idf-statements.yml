name: Update IDF Statements

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Enable verbose logging"
        required: false
        default: false
        type: boolean

      max_posts:
        description: "Maximum number of public Telegram posts to inspect in normal mode"
        required: false
        default: "120"
        type: string

      backfill:
        description: "Run Telegram API historical backfill"
        required: false
        default: false
        type: boolean

      backfill_since:
        description: "Backfill IDF posts from this date (YYYY-MM-DD)"
        required: false
        default: "2024-12-08"
        type: string

      backfill_max_posts:
        description: "Maximum Telegram API posts to inspect during backfill (0 = no explicit limit)"
        required: false
        default: "0"
        type: string

  schedule:
    # Four times per day, UTC.
    - cron: "17 2,8,14,20 * * *"

permissions:
  contents: write

concurrency:
  group: update-idf-statements
  cancel-in-progress: false

jobs:
  update-idf-statements:
    name: Build Israel Military Activity data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install telethon

      - name: Locate IDF statements script
        id: locate_script
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATES=(
            "scripts/update_idf_statements.py"
            "update_idf_statements.py"
          )

          SCRIPT_PATH=""

          for CANDIDATE in "${CANDIDATES[@]}"; do
            if [[ -f "${CANDIDATE}" ]]; then
              SCRIPT_PATH="${CANDIDATE}"
              break
            fi
          done

          if [[ -z "${SCRIPT_PATH}" ]]; then
            SCRIPT_PATH="$(
              find . -maxdepth 4 -type f \
                -name "update_idf_statements.py" \
                -print -quit \
              | sed 's#^\./##'
            )"
          fi

          if [[ -z "${SCRIPT_PATH}" || ! -f "${SCRIPT_PATH}" ]]; then
            echo "ERROR: update_idf_statements.py was not found."
            echo ""
            echo "Expected one of these paths:"
            echo "  scripts/update_idf_statements.py"
            echo "  update_idf_statements.py"
            echo ""
            echo "Available Python files:"
            find . -maxdepth 4 -type f -name "*.py" -print || true
            exit 1
          fi

          echo "Found script: ${SCRIPT_PATH}"
          echo "script_path=${SCRIPT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            "${{ steps.locate_script.outputs.script_path }}"

      - name: Resolve workflow options
        id: options
        shell: bash
        run: |
          set -euo pipefail

          MAX_POSTS="120"
          VERBOSE_OPTION=""
          BACKFILL_OPTION=""
          BACKFILL_SINCE="2024-12-08"
          BACKFILL_MAX_POSTS="0"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_MAX_POSTS="${{ inputs.max_posts }}"
            INPUT_BACKFILL_MAX_POSTS="${{ inputs.backfill_max_posts }}"

            if [[ "${INPUT_MAX_POSTS}" =~ ^[0-9]+$ ]] && \
               [[ "${INPUT_MAX_POSTS}" -ge 1 ]] && \
               [[ "${INPUT_MAX_POSTS}" -le 500 ]]; then
              MAX_POSTS="${INPUT_MAX_POSTS}"
            else
              echo "Invalid max_posts input. Using 120."
            fi

            if [[ "${{ inputs.verbose }}" == "true" ]]; then
              VERBOSE_OPTION="--verbose"
            fi

            if [[ "${{ inputs.backfill }}" == "true" ]]; then
              BACKFILL_OPTION="--telegram-backfill"
              BACKFILL_SINCE="${{ inputs.backfill_since }}"

              if [[ "${INPUT_BACKFILL_MAX_POSTS}" =~ ^[0-9]+$ ]]; then
                BACKFILL_MAX_POSTS="${INPUT_BACKFILL_MAX_POSTS}"
              else
                echo "Invalid backfill_max_posts input. Using 0."
                BACKFILL_MAX_POSTS="0"
              fi
            fi
          fi

          echo "max_posts=${MAX_POSTS}" >> "$GITHUB_OUTPUT"
          echo "verbose_option=${VERBOSE_OPTION}" >> "$GITHUB_OUTPUT"
          echo "backfill_option=${BACKFILL_OPTION}" >> "$GITHUB_OUTPUT"
          echo "backfill_since=${BACKFILL_SINCE}" >> "$GITHUB_OUTPUT"
          echo "backfill_max_posts=${BACKFILL_MAX_POSTS}" >> "$GITHUB_OUTPUT"

      - name: Verify Telegram secrets for backfill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill == true }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_API_ID:-}" ]]; then
            echo "ERROR: TELEGRAM_API_ID secret is missing."
            exit 1
          fi

          if [[ -z "${TELEGRAM_API_HASH:-}" ]]; then
            echo "ERROR: TELEGRAM_API_HASH secret is missing."
            exit 1
          fi

          if [[ -z "${TELEGRAM_SESSION:-}" ]]; then
            echo "ERROR: TELEGRAM_SESSION secret is missing."
            exit 1
          fi

          echo "Telegram API secrets are available."

      - name: Run IDF statements processor
        id: build
        shell: bash
        run: |
          set +e

          EXTRA_ARGS=()

          if [[ -n "${{ steps.options.outputs.verbose_option }}" ]]; then
            EXTRA_ARGS+=("${{ steps.options.outputs.verbose_option }}")
          fi

          if [[ -n "${{ steps.options.outputs.backfill_option }}" ]]; then
            EXTRA_ARGS+=("--telegram-backfill")
            EXTRA_ARGS+=("--since")
            EXTRA_ARGS+=("${{ steps.options.outputs.backfill_since }}")
            EXTRA_ARGS+=("--backfill-max-posts")
            EXTRA_ARGS+=("${{ steps.options.outputs.backfill_max_posts }}")
          fi

          python "${{ steps.locate_script.outputs.script_path }}" \
            --source-url "https://t.me/s/idfofficial" \
            --output "data/israel-military-activity.json" \
            --history "data/israel-military-activity-history.json" \
            --timeout 30 \
            --max-posts "${{ steps.options.outputs.max_posts }}" \
            --retention-days 730 \
            "${EXTRA_ARGS[@]}"

          EXIT_CODE=$?
          set -e

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [[ "${EXIT_CODE}" -eq 0 ]]; then
            echo "IDF statements data updated successfully."
          elif [[ "${EXIT_CODE}" -eq 2 ]]; then
            echo "No Telegram posts were parsed."
            exit 2
          else
            echo "Processor failed with exit code ${EXIT_CODE}."
            exit "${EXIT_CODE}"
          fi

      - name: Verify generated JSON files
        shell: bash
        run: |
          set -euo pipefail

          test -f data/israel-military-activity.json
          test -f data/israel-military-activity-history.json

          python - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("data/israel-military-activity.json")
          history_path = Path("data/israel-military-activity-history.json")

          current = json.loads(current_path.read_text(encoding="utf-8"))
          history = json.loads(history_path.read_text(encoding="utf-8"))

          events = current.get("events", [])
          map_events = current.get("map_events", [])
          analytics = current.get("analytics", {})
          overview = analytics.get("overview", {})

          if not isinstance(events, list):
              raise SystemExit("events must be a list")

          if not isinstance(map_events, list):
              raise SystemExit("map_events must be a list")

          if not isinstance(history.get("events", []), list):
              raise SystemExit("history events must be a list")

          allowed_activity_types = {
              "airstrike",
              "ground_activity",
              "artillery",
              "cross_border_fire",
              "drone_activity",
              "evacuation_warning",
              "humanitarian_zone",
          }

          for event in events:
              if not event.get("id"):
                  raise SystemExit("Event without id found")

              if event.get("activity_type") not in allowed_activity_types:
                  raise SystemExit(
                      f"Unsupported activity type: "
                      f"{event.get('activity_type')}"
                  )

          for event in map_events:
              if event.get("map_visualizable") is not True:
                  raise SystemExit(
                      "Non-visualizable event found in map_events"
                  )

              latitude = event.get("latitude")
              longitude = event.get("longitude")

              if not isinstance(latitude, (int, float)):
                  raise SystemExit("Invalid map event latitude")

              if not isinstance(longitude, (int, float)):
                  raise SystemExit("Invalid map event longitude")

          region_counts = {}
          for event in events:
              for region in event.get("regions", []):
                  region_counts[region] = (
                      region_counts.get(region, 0) + 1
                  )

          print("Generated at:", current.get("generated_at"))
          print("Total events:", len(events))
          print("Map events:", len(map_events))
          print("Latest event:", overview.get("latest_event_date"))
          print("Region counts:", region_counts)
          print("Syria events:", region_counts.get("Syria", 0))
          print("History events:", len(history.get("events", [])))
          PY

      - name: Upload generated IDF data
        uses: actions/upload-artifact@v4
        with:
          name: idf-statements-data-${{ github.run_number }}
          path: |
            data/israel-military-activity.json
            data/israel-military-activity-history.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/israel-military-activity.json
          git add data/israel-military-activity-history.json

          if git diff --cached --quiet; then
            echo "No IDF statement data changes to commit."
            exit 0
          fi

          git commit -m "Update IDF military activity data"

          for ATTEMPT in 1 2 3; do
            if git push; then
              echo "Push completed."
              exit 0
            fi

            if [[ "${ATTEMPT}" -eq 3 ]]; then
              echo "Push failed after ${ATTEMPT} attempts."
              exit 1
            fi

            echo "Push attempt ${ATTEMPT} failed. Rebasing and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 5
          done
