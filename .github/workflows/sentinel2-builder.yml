name: ME Sentinel-2 Image Builder

on:
  workflow_dispatch:
    inputs:
      targets:
        description: |
          Maximum 5 locations. Separate locations with semicolons:
          Location|latitude|longitude|radius_km
        required: true
        default: "Tehran|35.6892|51.3890|10; Isfahan|32.6546|51.6680|10; Bandar Abbas|27.1832|56.2666|12"
        type: string

      target_date:
        description: "Target date for the AFTER image (YYYY-MM-DD)"
        required: true
        default: "2026-08-01"
        type: string

      comparison_days:
        description: "Days between BEFORE and AFTER requested dates"
        required: true
        default: "30"
        type: string

      tolerance_days:
        description: "Search tolerance around each requested date (days)"
        required: true
        default: "5"
        type: string

      max_cloud:
        description: "Maximum cloud coverage percent"
        required: true
        default: "80"
        type: string

      image_size:
        description: "Square image size in pixels"
        required: true
        default: "1024"
        type: choice
        options:
          - "512"
          - "768"
          - "1024"
          - "1536"

permissions:
  contents: write

concurrency:
  group: me-sentinel2-builder
  cancel-in-progress: false

jobs:
  build-sentinel2-images:
    name: Build up to five Sentinel-2 before/after records
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The workflow only needs the current repository state. Avoid
          # downloading the complete, image-heavy Git history on every run.
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install change-detection dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26,<3" \
            "opencv-python-headless>=4.10,<5" \
            "scikit-image>=0.24,<1"

          python - <<'PY'
          import cv2
          import numpy
          import skimage

          print(f"OpenCV: {cv2.__version__}")
          print(f"NumPy: {numpy.__version__}")
          print(f"scikit-image: {skimage.__version__}")
          PY

      - name: Verify required repository files
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/update_sentinel2.py || {
            echo "::error::Missing builder script: scripts/update_sentinel2.py"
            exit 1
          }

          echo "Builder script found: scripts/update_sentinel2.py"

          if test -s data/iranstrike.json; then
            echo "IranStrike source found: data/iranstrike.json"
            ls -lh data/iranstrike.json
          else
            echo "::warning::data/iranstrike.json is missing or empty. The builder will continue, but IranStrike correlation will be unavailable."
          fi

      - name: Verify Sentinel Hub and FIRMS secrets
        shell: bash
        env:
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        run: |
          set -euo pipefail

          test -n "$SENTINELHUB_CLIENT_ID" || {
            echo "::error::Missing repository secret: SENTINELHUB_CLIENT_ID"
            exit 1
          }

          test -n "$SENTINELHUB_CLIENT_SECRET" || {
            echo "::error::Missing repository secret: SENTINELHUB_CLIENT_SECRET"
            exit 1
          }

          test -n "$FIRMS_KEY" || {
            echo "::error::Missing repository secret: FIRMS_KEY"
            exit 1
          }

          echo "Required Sentinel Hub and NASA FIRMS secrets are configured."

      - name: Validate shared settings and target list
        id: validation
        shell: bash
        env:
          TARGETS_INPUT: ${{ inputs.targets }}
          TARGET_DATE: ${{ inputs.target_date }}
          COMPARISON_DAYS: ${{ inputs.comparison_days }}
          TOLERANCE_DAYS: ${{ inputs.tolerance_days }}
          MAX_CLOUD: ${{ inputs.max_cloud }}
          IMAGE_SIZE: ${{ inputs.image_size }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          from datetime import date
          from pathlib import Path

          raw_targets = os.environ.get("TARGETS_INPUT", "").strip()
          target_date = os.environ["TARGET_DATE"].strip()
          comparison_days = int(os.environ["COMPARISON_DAYS"])
          tolerance_days = int(os.environ["TOLERANCE_DAYS"])
          max_cloud = int(os.environ["MAX_CLOUD"])
          image_size = int(os.environ["IMAGE_SIZE"])

          try:
              date.fromisoformat(target_date)
          except ValueError as error:
              raise SystemExit(
                  "target_date must use YYYY-MM-DD format."
              ) from error

          if not 1 <= comparison_days <= 3650:
              raise SystemExit(
                  "comparison_days must be between 1 and 3650."
              )

          if not 0 <= tolerance_days <= 30:
              raise SystemExit(
                  "tolerance_days must be between 0 and 30."
              )

          if not 0 <= max_cloud <= 100:
              raise SystemExit(
                  "max_cloud must be between 0 and 100."
              )

          if image_size not in {512, 768, 1024, 1536}:
              raise SystemExit("Unsupported image_size.")

          target_entries = [
              entry.strip()
              for entry in re.split(r"[;\r\n]+", raw_targets)
              if entry.strip() and not entry.strip().startswith("#")
          ]

          parsed = []

          for entry_number, entry in enumerate(target_entries, start=1):
              parts = [part.strip() for part in entry.split("|")]

              if len(parts) != 4:
                  raise SystemExit(
                      f"Target {entry_number}: expected "
                      "Location name|latitude|longitude|radius_km. "
                      "Separate multiple targets with semicolons."
                  )

              location_name, lat_text, lon_text, radius_text = parts

              if not location_name:
                  raise SystemExit(
                      f"Target {entry_number}: location name is empty."
                  )

              try:
                  lat = float(lat_text)
                  lon = float(lon_text)
                  radius = float(radius_text)
              except ValueError as error:
                  raise SystemExit(
                      f"Target {entry_number}: latitude, longitude and radius "
                      "must be numeric."
                  ) from error

              if not -90 <= lat <= 90:
                  raise SystemExit(
                      f"Target {entry_number}: latitude must be between -90 and 90."
                  )

              if not -180 <= lon <= 180:
                  raise SystemExit(
                      f"Target {entry_number}: longitude must be between -180 and 180."
                  )

              if not 0.1 <= radius <= 100:
                  raise SystemExit(
                      f"Target {entry_number}: radius must be between 0.1 and 100 km."
                  )

              parsed.append(
                  {
                      "location_name": location_name,
                      "lat": lat,
                      "lon": lon,
                      "radius_km": radius,
                  }
              )

          if not parsed:
              raise SystemExit("At least one valid target is required.")

          if len(parsed) > 5:
              raise SystemExit(
                  f"Maximum 5 targets are allowed; received {len(parsed)}."
              )

          Path("/tmp/me-sentinel2-targets.json").write_text(
              json.dumps(parsed, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          delimiter = "ME_SENTINEL_TARGETS_EOF"

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"target_count={len(parsed)}\n")
              output.write(f"targets_json<<{delimiter}\n")
              output.write(json.dumps(parsed, ensure_ascii=False))
              output.write(f"\n{delimiter}\n")

          print(f"Validated {len(parsed)} target(s).")
          print(f"AFTER requested date: {target_date}")
          print(f"Comparison offset: {comparison_days} days")
          print(f"Tolerance: ±{tolerance_days} days")

          for index, target in enumerate(parsed, start=1):
              print(
                  f"{index}. {target['location_name']} | "
                  f"{target['lat']}, {target['lon']} | "
                  f"{target['radius_km']} km"
              )
          PY

      - name: Build Sentinel-2 images and analysis records
        shell: bash
        env:
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
          TARGETS_JSON: ${{ steps.validation.outputs.targets_json }}
          TARGET_DATE: ${{ inputs.target_date }}
          COMPARISON_DAYS: ${{ inputs.comparison_days }}
          TOLERANCE_DAYS: ${{ inputs.tolerance_days }}
          MAX_CLOUD: ${{ inputs.max_cloud }}
          IMAGE_SIZE: ${{ inputs.image_size }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          targets = json.loads(os.environ["TARGETS_JSON"])
          failures = []

          for index, target in enumerate(targets, start=1):
              location_name = target["location_name"]

              print()
              print("=" * 72)
              print(f"[{index}/{len(targets)}] Processing: {location_name}")
              print("=" * 72)

              command = [
                  sys.executable,
                  "scripts/update_sentinel2.py",
                  "--location-name",
                  location_name,
                  "--lat",
                  str(target["lat"]),
                  "--lon",
                  str(target["lon"]),
                  "--radius-km",
                  str(target["radius_km"]),
                  "--target-date",
                  os.environ["TARGET_DATE"],
                  "--comparison-days",
                  os.environ["COMPARISON_DAYS"],
                  "--tolerance-days",
                  os.environ["TOLERANCE_DAYS"],
                  "--max-cloud",
                  os.environ["MAX_CLOUD"],
                  "--width",
                  os.environ["IMAGE_SIZE"],
                  "--height",
                  os.environ["IMAGE_SIZE"],
              ]

              result = subprocess.run(command, check=False)

              if result.returncode != 0:
                  failures.append(
                      {
                          "location_name": location_name,
                          "returncode": result.returncode,
                      }
                  )
                  print(
                      f"::error::Sentinel-2 processing failed for "
                      f"{location_name} with exit code {result.returncode}"
                  )
              else:
                  print(f"Completed: {location_name}")

          if failures:
              print()
              print("Failed targets:")

              for failure in failures:
                  print(
                      f"- {failure['location_name']} "
                      f"(exit code {failure['returncode']})"
                  )

              raise SystemExit(
                  f"{len(failures)} of {len(targets)} target(s) failed."
              )

          print()
          print(f"All {len(targets)} target(s) processed successfully.")
          PY

      - name: Verify legacy and scalable satellite outputs
        shell: bash
        env:
          TARGETS_JSON: ${{ steps.validation.outputs.targets_json }}
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "docs/data/satellite/archive-index.json"
            "docs/data/satellite/locations.json"
            "docs/data/satellite/satellite-metadata.json"
            "docs/data/satellite/sentinel2/latest.png"
            "docs/data/satellite/sentinel2/latest.json"
            "docs/data/satellite/sentinel2/index.json"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            test -s "$file" || {
              echo "::error::Required output is missing or empty: $file"
              exit 1
            }

            ls -lh "$file"
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          archive_path = Path("docs/data/satellite/archive-index.json")
          locations_path = Path("docs/data/satellite/locations.json")

          archive = json.loads(archive_path.read_text(encoding="utf-8"))
          locations = json.loads(locations_path.read_text(encoding="utf-8"))
          targets = json.loads(os.environ["TARGETS_JSON"])

          if not isinstance(archive, list) or not archive:
              raise SystemExit(
                  "archive-index.json must contain a non-empty JSON array."
              )

          if not isinstance(locations, list) or not locations:
              raise SystemExit(
                  "locations.json must contain a non-empty JSON array."
              )

          def resolve_repo_file(url_value):
              relative = str(url_value or "").strip().lstrip("./")

              if not relative:
                  return None

              candidates = [Path(relative)]

              if relative.startswith("data/"):
                  candidates.append(Path("docs") / relative)
              elif not relative.startswith("docs/"):
                  candidates.append(Path("docs") / relative)

              for candidate in candidates:
                  if candidate.is_file():
                      return candidate

              return candidates[-1]

          def matching_location(location_name):
              expected = str(location_name).strip().casefold()

              for location in locations:
                  actual = str(
                      location.get("name")
                      or location.get("location_name")
                      or ""
                  ).strip().casefold()

                  if actual == expected:
                      return location

              return None

          def matching_legacy_record(location_name):
              expected = str(location_name).strip().casefold()

              for record in archive:
                  actual = str(
                      record.get("location_name", "")
                  ).strip().casefold()

                  if actual == expected:
                      return record

              return None

          verified_results = []

          for target in targets:
              location_name = target["location_name"]
              location = matching_location(location_name)

              if not location:
                  raise SystemExit(
                      "Processed location missing from locations.json: "
                      + location_name
                  )

              required_location_fields = (
                  "slug",
                  "name",
                  "lat",
                  "lon",
                  "bbox",
                  "latest_record_id",
                  "latest_record_url",
                  "latest_thumbnail_url",
                  "index_url",
              )

              missing_location = [
                  field
                  for field in required_location_fields
                  if location.get(field) in (None, "", [])
              ]

              if missing_location:
                  raise SystemExit(
                      f"{location_name}: locations.json entry is missing: "
                      + ", ".join(missing_location)
                  )

              location_index_path = resolve_repo_file(
                  location["index_url"]
              )
              record_path = resolve_repo_file(
                  location["latest_record_url"]
              )
              thumbnail_path = resolve_repo_file(
                  location["latest_thumbnail_url"]
              )

              for label, path in (
                  ("location index", location_index_path),
                  ("detailed record", record_path),
                  ("latest thumbnail", thumbnail_path),
              ):
                  if path is None or not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(
                          f"{location_name}: {label} is missing or empty: {path}"
                      )

              location_index = json.loads(
                  location_index_path.read_text(encoding="utf-8")
              )

              if not isinstance(location_index, list) or not location_index:
                  raise SystemExit(
                      f"{location_name}: location index must be a non-empty array."
                  )

              latest_record_id = str(location["latest_record_id"])

              if not any(
                  str(item.get("id")) == latest_record_id
                  for item in location_index
                  if isinstance(item, dict)
              ):
                  raise SystemExit(
                      f"{location_name}: latest record is missing from location index: "
                      f"{latest_record_id}"
                  )

              record = json.loads(record_path.read_text(encoding="utf-8"))

              required_record_fields = (
                  "id",
                  "location_name",
                  "location_slug",
                  "bbox",
                  "image_url",
                  "before",
                  "after",
                  "change_detection",
              )

              missing_record = [
                  field
                  for field in required_record_fields
                  if record.get(field) in (None, "", [])
              ]

              if missing_record:
                  raise SystemExit(
                      f"{location_name}: detailed record is missing: "
                      + ", ".join(missing_record)
                  )

              for phase in ("before", "after"):
                  phase_data = record.get(phase) or {}
                  phase_url = phase_data.get("image_url")
                  phase_path = resolve_repo_file(phase_url)

                  if phase_path is None or not phase_path.is_file():
                      raise SystemExit(
                          f"{location_name}: {phase} image does not exist: "
                          f"{phase_url} (resolved as {phase_path})"
                      )

              change = record.get("change_detection") or {}

              if change.get("status") != "completed":
                  raise SystemExit(
                      f"{location_name}: change detection status is not completed: "
                      f"{change.get('status')}"
                  )

              required_change_fields = (
                  "score",
                  "level",
                  "comparability",
                  "comparability_score",
                  "ssim",
                  "changed_pixel_percent",
                  "significant_regions",
                  "change_map_url",
                  "assessment",
                  "warnings",
                  "regions",
              )

              missing_change = [
                  field
                  for field in required_change_fields
                  if field not in change
              ]

              if missing_change:
                  raise SystemExit(
                      f"{location_name}: change_detection is missing fields: "
                      + ", ".join(missing_change)
                  )

              change_map_path = resolve_repo_file(
                  change.get("change_map_url")
              )

              if (
                  change_map_path is None
                  or not change_map_path.is_file()
                  or change_map_path.stat().st_size == 0
              ):
                  raise SystemExit(
                      f"{location_name}: change map does not exist: "
                      f"{change.get('change_map_url')} "
                      f"(resolved as {change_map_path})"
                  )

              imagery = record.get("imagery") or {}
              thumbnail_urls = {
                  "before": imagery.get("before_thumbnail"),
                  "after": imagery.get("after_thumbnail"),
                  "change": imagery.get("change_thumbnail"),
              }

              for thumbnail_name, thumbnail_url in thumbnail_urls.items():
                  thumbnail = resolve_repo_file(thumbnail_url)

                  if (
                      thumbnail is None
                      or not thumbnail.is_file()
                      or thumbnail.stat().st_size == 0
                      or thumbnail.suffix.lower() != ".webp"
                  ):
                      raise SystemExit(
                          f"{location_name}: {thumbnail_name} WebP thumbnail "
                          f"is missing or invalid: {thumbnail_url} "
                          f"(resolved as {thumbnail})"
                      )

              score = float(change["score"])
              changed_percent = float(change["changed_pixel_percent"])
              comparability_score = float(change["comparability_score"])
              ssim = float(change["ssim"])
              regions = int(change["significant_regions"])

              if not 0.0 <= score <= 100.0:
                  raise SystemExit(
                      f"{location_name}: invalid change score: {score}"
                  )

              if not 0.0 <= changed_percent <= 100.0:
                  raise SystemExit(
                      f"{location_name}: invalid changed pixel percent: "
                      f"{changed_percent}"
                  )

              if not 0.0 <= comparability_score <= 100.0:
                  raise SystemExit(
                      f"{location_name}: invalid comparability score: "
                      f"{comparability_score}"
                  )

              if not -1.0 <= ssim <= 1.0:
                  raise SystemExit(
                      f"{location_name}: invalid SSIM value: {ssim}"
                  )

              if regions < 0:
                  raise SystemExit(
                      f"{location_name}: invalid region count: {regions}"
                  )

              firms = change.get("firms_correlation") or {}
              iranstrike = change.get("iranstrike_correlation") or {}

              # Keep the legacy archive as a verified migration fallback.
              legacy_record = matching_legacy_record(location_name)

              if not legacy_record:
                  raise SystemExit(
                      "Processed location missing from archive-index.json: "
                      + location_name
                  )

              if str(legacy_record.get("id")) != str(record.get("id")):
                  raise SystemExit(
                      f"{location_name}: scalable and legacy latest record IDs "
                      "do not match."
                  )

              verified_results.append(
                  {
                      "location_name": location_name,
                      "location_slug": location["slug"],
                      "record_id": record["id"],
                      "record_path": str(record_path),
                      "location_index_path": str(location_index_path),
                      "thumbnail_count": 3,
                      "score": score,
                      "level": str(change["level"]),
                      "comparability": str(change["comparability"]),
                      "comparability_score": comparability_score,
                      "changed_pixel_percent": changed_percent,
                      "significant_regions": regions,
                      "firms_status": str(
                          firms.get("status", "unavailable")
                      ),
                      "firms_aoi_hotspots": int(
                          firms.get("aoi_hotspot_count", 0) or 0
                      ),
                      "firms_correlated_regions": int(
                          firms.get("regions_with_correlation", 0) or 0
                      ),
                      "iranstrike_status": str(
                          iranstrike.get("status", "unavailable")
                      ),
                      "iranstrike_aoi_events": int(
                          iranstrike.get("aoi_event_count", 0) or 0
                      ),
                      "iranstrike_correlated_regions": int(
                          iranstrike.get("regions_with_correlation", 0) or 0
                      ),
                  }
              )

          results_path = Path("/tmp/me-sentinel2-change-results.json")
          results_path.write_text(
              json.dumps(
                  verified_results,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(f"Legacy archive verified: {len(archive)} total record(s)")
          print(f"Scalable index verified: {len(locations)} location(s)")
          print(f"Current run verified: {len(verified_results)} target(s)")

          for result in verified_results:
              print(
                  f"- {result['location_name']}: "
                  f"score={result['score']}/100, "
                  f"level={result['level']}, "
                  f"changed={result['changed_pixel_percent']}%, "
                  f"comparability={result['comparability']} "
                  f"({result['comparability_score']}%), "
                  f"regions={result['significant_regions']}, "
                  f"FIRMS={result['firms_status']} "
                  f"({result['firms_aoi_hotspots']} AOI hotspots, "
                  f"{result['firms_correlated_regions']} regions), "
                  f"IranStrike={result['iranstrike_status']} "
                  f"({result['iranstrike_aoi_events']} AOI events, "
                  f"{result['iranstrike_correlated_regions']} regions)"
              )
          PY

          echo "Generated PNG analysis images:"
          find docs/data/satellite/sentinel2/history \
            -maxdepth 5 \
            -type f \
            -name "*.png" \
            -print 2>/dev/null || true

          echo "Generated WebP thumbnails:"
          find docs/data/satellite/sentinel2/history \
            -maxdepth 5 \
            -type f \
            -name "*_thumb.webp" \
            -print 2>/dev/null || true

          echo "Generated scalable record files:"
          find docs/data/satellite/locations \
            -maxdepth 4 \
            -type f \
            -name "*.json" \
            -print 2>/dev/null || true

      - name: Commit generated Sentinel-2 files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # The complete satellite directory now contains both the legacy
          # migration fallback and the scalable lazy-loading data layout.
          git add -f docs/data/satellite

          git status --short

          if git diff --cached --quiet; then
            echo "No Sentinel-2 changes to commit."
            exit 0
          fi

          git commit -m \
            "Update ME Sentinel-2 scalable analysis (${{ steps.validation.outputs.target_count }} locations)"

          git push

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          SUMMARY_TARGET_COUNT: ${{ steps.validation.outputs.target_count }}
          SUMMARY_TARGET_DATE: ${{ inputs.target_date }}
          SUMMARY_COMPARISON_DAYS: ${{ inputs.comparison_days }}
          SUMMARY_TOLERANCE_DAYS: ${{ inputs.tolerance_days }}
          SUMMARY_MAX_CLOUD: ${{ inputs.max_cloud }}
          SUMMARY_IMAGE_SIZE: ${{ inputs.image_size }}
          SUMMARY_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          results_path = Path("/tmp/me-sentinel2-change-results.json")
          locations_path = Path("docs/data/satellite/locations.json")

          lines = [
              "## ME Sentinel-2 Scalable Analysis",
              "",
              f"- **Requested locations:** "
              f"{os.environ.get('SUMMARY_TARGET_COUNT', 'n/a')}",
              f"- **AFTER requested date:** "
              f"{os.environ.get('SUMMARY_TARGET_DATE', 'n/a')}",
              f"- **Comparison offset:** "
              f"{os.environ.get('SUMMARY_COMPARISON_DAYS', 'n/a')} days",
              f"- **Tolerance:** "
              f"±{os.environ.get('SUMMARY_TOLERANCE_DAYS', 'n/a')} days",
              f"- **Maximum cloud coverage:** "
              f"{os.environ.get('SUMMARY_MAX_CLOUD', 'n/a')}%",
              f"- **Image size:** "
              f"{os.environ.get('SUMMARY_IMAGE_SIZE', 'n/a')} × "
              f"{os.environ.get('SUMMARY_IMAGE_SIZE', 'n/a')} px",
              f"- **Workflow result:** "
              f"{os.environ.get('SUMMARY_JOB_STATUS', 'unknown')}",
              "",
          ]

          if results_path.is_file():
              results = json.loads(
                  results_path.read_text(encoding="utf-8")
              )

              lines.extend(
                  [
                      "### Automatic visual and OSINT correlation results",
                      "",
                      "| Location | Score | Level | Changed | Regions | "
                      "FIRMS | Hotspots | IranStrike | Events | Thumbnails |",
                      "|---|---:|---|---:|---:|---|---:|---|---:|---:|",
                  ]
              )

              for result in results:
                  lines.append(
                      f"| {result['location_name']} "
                      f"| {result['score']:.2f}/100 "
                      f"| {result['level']} "
                      f"| {result['changed_pixel_percent']:.2f}% "
                      f"| {result['significant_regions']} "
                      f"| {result.get('firms_status', 'unavailable')} "
                      f"| {result.get('firms_aoi_hotspots', 0)} "
                      f"| {result.get('iranstrike_status', 'unavailable')} "
                      f"| {result.get('iranstrike_aoi_events', 0)} "
                      f"| {result.get('thumbnail_count', 0)} |"
                  )

              lines.extend(
                  [
                      "",
                      "### Scalable output",
                      "",
                      f"- **Detailed records created or verified:** {len(results)}",
                      f"- **WebP thumbnails created or verified:** "
                      f"{sum(item.get('thumbnail_count', 0) for item in results)}",
                  ]
              )

              if locations_path.is_file():
                  locations = json.loads(
                      locations_path.read_text(encoding="utf-8")
                  )
                  lines.append(
                      f"- **Locations in lightweight index:** {len(locations)}"
                  )

              lines.extend(
                  [
                      "",
                      "> Visual change detection is a screening indicator. "
                      "It does not independently confirm damage, military "
                      "activity, or the cause of a detected change.",
                      "",
                      "> FIRMS and IranStrike matches are spatial-temporal "
                      "correlations. They require analyst verification and do "
                      "not independently prove causation.",
                      "",
                  ]
              )
          else:
              lines.extend(
                  [
                      "Verification results were not available because the "
                      "verification step did not complete.",
                      "",
                  ]
              )

          lines.extend(
              [
                  "Lightweight locations index: "
                  "`docs/data/satellite/locations.json`",
                  "",
                  "Per-location indexes and detailed records: "
                  "`docs/data/satellite/locations/`",
                  "",
                  "Legacy migration fallback: "
                  "`docs/data/satellite/archive-index.json`",
                  "",
              ]
          )

          with summary_path.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

